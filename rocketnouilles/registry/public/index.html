<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RocketNouilles Registry</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; color: #2b1d14; background: #fff8ef; }
      code { background: #f3e3cf; padding: 0.1rem 0.3rem; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>🚀🍜 RocketNouilles registry</h1>
    <p>Peer discovery for RocketNouilles nodes. This is an API, not an app.</p>
    <ul>
      <li><code>GET /api/health</code></li>
      <li><code>GET /api/tables</code></li>
      <li><code>GET|POST /api/tables/:code/peers</code></li>
      <li><code>DELETE /api/tables/:code/peers/:name</code></li>
    </ul>
  </body>
</html>
